update_check_interval 0
shell_integration no-rc
allow_remote_control socket
listen_on unix:/tmp/kitty
shell_integration enabled
window_padding_width 4
scrollback_lines 10000
notify_on_cmd_finish invisible
font_family      JetBrainsMono NF
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Italic
bold_italic_font JetBrainsMono NF Bold Italic
font_size 12.0
remember_window_size  false



# Generated from Base16 Carbon
# Main Colors
foreground            #f2f4f8
background            #161616
selection_foreground  #161616
selection_background  #f2f4f8
url_color             #33b1ff
cursor                #f2f4f8
cursor_text_color     #161616

# Tabs
active_tab_foreground   #161616
active_tab_background   #78a9ff
inactive_tab_foreground #f2f4f8
inactive_tab_background #353535

# The 16 Terminal Colors

# Black
color0 #161616
color8 #484848

# Red
color1 #ee5396
color9 #ff7eb6

# Green
color2  #25be6a
color10 #25be6a

# Yellow
color3  #08bdba
color11 #3ddbd9

# Blue
color4  #78a9ff
color12 #78a9ff

# Magenta
color5  #be95ff
color13 #be95ff

# Cyan
color6  #33b1ff
color14 #3ddbd9

# White
color7  #f2f4f8
color15 #e4e4e5

# kitty_mod ctrl+shift

enabled_layouts grid
enabled_layouts splits:split_axis=horizontal

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+n next_tab
map ctrl+shift+p previous_tab

# Splits
map ctrl+alt+s launch --location=hsplit
map ctrl+alt+v launch --location=vsplit

# Move focus between windows
# map ctrl+h neighboring_window left
# map ctrl+l neighboring_window right
# map ctrl+k neighboring_window up
# map ctrl+j neighboring_window down

# Move windows themselves
map ctrl+shift+h move_window left
map ctrl+shift+l move_window right
map ctrl+shift+k move_window up
map ctrl+shift+j move_window down

map ctrl+left resize_window narrower
map ctrl+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter 3
map ctrl+0 resize_window reset

map --allow-fallback=shifted,ascii ctrl+shift+p scroll_to_prompt -1 
map --allow-fallback=shifted,ascii ctrl+shift+n scroll_to_prompt 1

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '$HOME/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
# Browse scrollback buffer in nvim
map alt+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map alt+shift+l kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
map alt+l kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

# Show clicked command output in nvim
 mouse_map alt+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
